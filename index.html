<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gift Hub Online Exam</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    margin:0;
    background:#f4f6f9;
    color:#222;
}

.header{
    background:#6c2bd9;
    color:white;
    text-align:center;
    padding:25px 15px;
}

.header h1{
    margin:0;
}

.container{
    max-width:850px;
    margin:30px auto;
    padding:15px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 5px 20px rgba(0,0,0,.08);
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0 15px;
    border:1px solid #ddd;
    border-radius:8px;
    font-size:16px;
}

button{
    background:#6c2bd9;
    color:white;
    border:0;
    padding:13px 22px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#5420ad;
}

.timer{
    background:#fff0f0;
    color:#d00000;
    padding:13px;
    text-align:center;
    border-radius:8px;
    font-weight:bold;
    margin-bottom:20px;
}

.question{
    font-size:20px;
    font-weight:bold;
    margin-bottom:18px;
}

.option{
    display:block;
    border:1px solid #ddd;
    padding:14px;
    margin:10px 0;
    border-radius:8px;
    cursor:pointer;
}

.option:hover{
    background:#f3edff;
}

.result{
    text-align:center;
}

.score{
    font-size:42px;
    font-weight:bold;
    color:#6c2bd9;
}

.hidden{
    display:none;
}

.info{
    background:#f5f1ff;
    padding:12px;
    border-radius:8px;
    margin-bottom:15px;
}
</style>
</head>

<body>

<div class="header">
    <h1>🎁 Gift Hub</h1>
    <p>Online MCQ Examination</p>
</div>

<div class="container">

<!-- STUDENT INFORMATION -->

<div class="card" id="startPage">

<h2>পরীক্ষা শুরু করুন</h2>

<label>👤 শিক্ষার্থীর নাম</label>
<input id="studentName" type="text" placeholder="আপনার নাম">

<label>🔢 রোল</label>
<input id="studentRoll" type="text" placeholder="রোল নম্বর">

<label>🏫 স্কুল / মাদ্রাসার নাম</label>
<input id="institution" type="text" placeholder="প্রতিষ্ঠানের নাম">

<label>📚 বিভাগ / গ্রুপ</label>
<select id="group">
<option value="">বিভাগ নির্বাচন করুন</option>
<option>Science</option>
<option>Arts</option>
<option>Commerce</option>
<option>Other</option>
</select>

<label>🏷️ শ্রেণি</label>
<select id="className">
<option value="">শ্রেণি নির্বাচন করুন</option>
<option>৬ষ্ঠ</option>
<option>৭ম</option>
<option>৮ম</option>
<option>৯ম</option>
<option>১০ম</option>
<option>অন্যান্য</option>
</select>

<button onclick="startExam()">পরীক্ষা শুরু করুন</button>

</div>


<!-- EXAM PAGE -->

<div class="card hidden" id="examPage">

<div class="info">
    <b>পরীক্ষার্থী:</b>
    <span id="showName"></span>
    <br>
    <b>রোল:</b>
    <span id="showRoll"></span>
</div>

<div class="timer">
⏱️ সময় বাকি:
<span id="timer">30:00</span>
</div>

<div id="questionArea"></div>

<button onclick="nextQuestion()">পরবর্তী প্রশ্ন</button>

</div>


<!-- RESULT -->

<div class="card result hidden" id="resultPage">

<h2>🎉 পরীক্ষা শেষ</h2>

<p id="resultStudent"></p>

<div class="score">
<span id="finalScore">0</span>
</div>

<p id="resultDetails"></p>

<button onclick="location.reload()">
আবার পরীক্ষা দিন
</button>

</div>

</div>


<script>

/* =========================
   QUESTIONS
========================= */

const questions = [

{
question:"বাংলাদেশের রাজধানী কোনটি?",
options:[
"চট্টগ্রাম",
"ঢাকা",
"সিলেট",
"রাজশাহী"
],
answer:1
},

{
question:"বাংলাদেশের জাতীয় ফুল কোনটি?",
options:[
"গোলাপ",
"শাপলা",
"জবা",
"বেলি"
],
answer:1
},

{
question:"পানির রাসায়নিক সংকেত কোনটি?",
options:[
"CO2",
"O2",
"H2O",
"NaCl"
],
answer:2
},

{
question:"সূর্যের চারদিকে পৃথিবী কী করে?",
options:[
"ঘোরে",
"স্থির থাকে",
"থামে",
"ভাসে"
],
answer:0
},

{
question:"বাংলা ভাষার বর্ণমালায় স্বরবর্ণ কয়টি?",
options:[
"১০টি",
"১১টি",
"১২টি",
"১৩টি"
],
answer:1
}

];


/* =========================
   VARIABLES
========================= */

let currentQuestion = 0;
let answers = [];

let timeLeft = 30 * 60;

let timerInterval;

let submitted = false;

let studentData = {};


/* =========================
   START EXAM
========================= */

function startExam(){

const name =
document.getElementById("studentName").value.trim();

const roll =
document.getElementById("studentRoll").value.trim();

const institution =
document.getElementById("institution").value.trim();

const group =
document.getElementById("group").value;

const className =
document.getElementById("className").value;


if(!name || !roll || !institution || !group || !className){

alert("সব তথ্য পূরণ করুন।");

return;

}


studentData = {

name:name,
roll:roll,
institution:institution,
group:group,
className:className

};


document.getElementById("showName").textContent=name;

document.getElementById("showRoll").textContent=roll;


document.getElementById("startPage").classList.add("hidden");

document.getElementById("examPage").classList.remove("hidden");


showQuestion();

timerInterval=setInterval(updateTimer,1000);

}


/* =========================
   SHOW QUESTION
========================= */

function showQuestion(){

const q=questions[currentQuestion];

let html="";

html+=`
<div class="question">
${currentQuestion+1}. ${q.question}
</div>
`;

q.options.forEach((option,index)=>{

html+=`
<label class="option">

<input
type="radio"
name="answer"
value="${index}"
>

${option}

</label>
`;

});


document.getElementById("questionArea").innerHTML=html;

}


/* =========================
   NEXT QUESTION
========================= */

function nextQuestion(){

const selected =
document.querySelector(
'input[name="answer"]:checked'
);


if(!selected){

alert("একটি উত্তর নির্বাচন করুন।");

return;

}


answers[currentQuestion]=
Number(selected.value);


currentQuestion++;


if(currentQuestion>=questions.length){

submitExam();

}

else{

showQuestion();

}

}


/* =========================
   TIMER
========================= */

function updateTimer(){

timeLeft--;

let minutes=Math.floor(timeLeft/60);

let seconds=timeLeft%60;


document.getElementById("timer").textContent=

String(minutes).padStart(2,"0")
+
":"
+
String(seconds).padStart(2,"0");


if(timeLeft<=0){

submitExam();

}

}


/* =========================
   SUBMIT
========================= */

function submitExam(){

if(submitted)return;

submitted=true;

clearInterval(timerInterval);


let correct=0;

answers.forEach((answer,index)=>{

if(answer===questions[index].answer){

correct++;

}

});


let wrong=questions.length-correct;

let percentage=
Math.round((correct/questions.length)*100);


document.getElementById("examPage")
.classList.add("hidden");


document.getElementById("resultPage")
.classList.remove("hidden");


document.getElementById("resultStudent").innerHTML=

`
<b>${studentData.name}</b><br>
রোল: ${studentData.roll}<br>
প্রতিষ্ঠান: ${studentData.institution}<br>
বিভাগ: ${studentData.group}<br>
শ্রেণি: ${studentData.className}
`;


document.getElementById("finalScore")
.textContent=
correct+" / "+questions.length;


document.getElementById("resultDetails")
.innerHTML=

`
📝 সঠিক: ${correct}<br>
❌ ভুল: ${wrong}<br>
📊 মোট নম্বর: ${correct}<br>
📈 শতাংশ: ${percentage}%
`;

}


/* =========================
   TAB / PAGE CHANGE
========================= */

document.addEventListener(
"visibilitychange",
function(){

if(
document.hidden &&
!submitted &&
!document.getElementById("examPage")
.classList.contains("hidden")
){

submitExam();

alert(
"আপনি পরীক্ষা থেকে বের হয়েছেন। আপনার পরীক্ষা জমা হয়ে গেছে।"
);

}

});


/* =========================
   BACK BUTTON PROTECTION
========================= */

history.pushState(null,null,location.href);

window.onpopstate=function(){

if(
!submitted &&
!document.getElementById("examPage")
.classList.contains("hidden")
){

submitExam();

alert(
"পরীক্ষা থেকে বের হওয়ার কারণে আপনার পরীক্ষা জমা হয়েছে।"
);

}

};

</script>

</body>
</html>
